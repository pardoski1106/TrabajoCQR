# Infraestructura local. RabbitMQ es necesario; PostgreSQL local es opcional
# (la base "oficial" del proyecto vive en la nube, ver docs/despliegue-nube.md).
#
#   docker compose up -d rabbitmq                 # solo RabbitMQ
#   docker compose --profile local-db up -d       # RabbitMQ + PostgreSQL local
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Consola web: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: cqrs
      POSTGRES_PASSWORD: cqrs
      POSTGRES_DB: cqrs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
